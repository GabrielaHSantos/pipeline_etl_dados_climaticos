version: '3.8'

# Template base (DRY) com variáveis globais aplicadas a todos os containers do Airflow
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.0
  environment:
    &airflow-common-env
    # Define arquitetura standalone (dispensa workers dedicados e fila Redis). Ideal para dev e portfólio.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # String de conexão apontando para o container de metadados interno
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas psycopg2-binary python-dotenv requests sqlalchemy"
    PYTHONPATH: /opt/airflow
  volumes:
    # Mapeamento de diretórios para persistência de logs e hot-reload de DAGs/código
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Banco de dados relacional exclusivo para gerenciar o estado e metadados do Airflow
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposição na 5433 para evitar colisão de porta com a instância do PostgreSQL nativa do host (WSL)
      - "5433:5432"
    healthcheck:
      # Garante que o banco está aceitando conexões antes de liberar o boot do Airflow
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Motor de orquestração: monitora o diretório de DAGs e aciona a execução das tarefas
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Interface de Usuário (UI) para monitoramento e gestão manual das DAGs
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Container efêmero de bootstrap: aplica migrações no banco e provisiona o usuário admin
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com
      --password admin"
    environment:
      <<: *airflow-common-env

volumes:
  postgres_data: